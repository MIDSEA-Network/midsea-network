name: Check images

on:
  push:
    branches: [main]
  pull_request:

jobs:
  image-links:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify all referenced images exist
        run: python3 scripts/check_image_links.py
